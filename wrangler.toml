# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "nba2k27"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
workers_dev = true

[build]
command = "npm run build && node scripts/ensure-www-dns.mjs"

[vars]
CANONICAL_HOST = "nba2k27hack.org"

# Apex + www on Cloudflare zone (www → apex 301 in workers/site.js)
[[routes]]
pattern = "nba2k27hack.org/*"
zone_name = "nba2k27hack.org"

[[routes]]
pattern = "www.nba2k27hack.org/*"
zone_name = "nba2k27hack.org"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
